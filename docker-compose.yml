services:
  backend:
    build: ./backend
    image: hoangson/trash-detection-backend:1.0
    ports:
      - 8000:8000
    volumes:
      - ./backend/data:/app/data
      - ./backend/images:/app/images
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  frontend:
    build: ./frontend
    image: hoangson/trash-detection-frontend:1.0
    ports:
      - 5173:80
    depends_on:
      - backend
  admin:
    build: ./admin
    image: hoangson/trash-detection-admin:1.0
    ports:
      - 3000:3000
    depends_on:
      - backend
