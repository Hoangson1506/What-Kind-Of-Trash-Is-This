services:
  backend:
    build: ./backend
    ports:
      - 8000:8000
    volumes:
      - ./backend/data:/app/data
      - ./backend/images:/app/images
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build: ./frontend
    ports:
      - 5173:80
    depends_on:
      - backend
  admin:
    build: ./admin
    ports:
      - 3000:3000
    depends_on:
      - backend
